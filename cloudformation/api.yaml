AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Public read-only status API: an HTTP API in front of a Lambda that reads the
  two DynamoDB tables. Throttled, since the endpoint is unauthenticated.
  Deployed with `aws cloudformation package` (scripts/deploy.sh does this).

Parameters:
  TargetsTableName:
    Type: String
  TargetsTableArn:
    Type: String
  ResultsTableName:
    Type: String
  ResultsTableArn:
    Type: String

Resources:
  StatusApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/serverless-monitor-status-api
      RetentionInDays: 14

  StatusApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: status-api-read-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:Scan
                Resource: !Ref TargetsTableArn
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !Ref ResultsTableArn

  StatusApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: StatusApiLogGroup
    Properties:
      FunctionName: serverless-monitor-status-api
      Runtime: python3.12
      Handler: lambda_function.handler
      Role: !GetAtt StatusApiRole.Arn
      Timeout: 10
      MemorySize: 256
      TracingConfig:
        Mode: Active
      Code: ../lambda/status-api
      Environment:
        Variables:
          TARGETS_TABLE: !Ref TargetsTableName
          RESULTS_TABLE: !Ref ResultsTableName

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: serverless-monitor-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: [GET]
        MaxAge: 300

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt StatusApiFunction.Arn
      PayloadFormatVersion: '2.0'

  StatusRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /status
      Target: !Sub integrations/${Integration}

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref StatusApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/status'

Outputs:
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/status'